# Round BUG1: copy new bug reports and ideas from Discord into the PRIVATE repository's branch claude/reports, every hour.
# This file belongs in the PUBLIC repository (github.com/Eliminate7532/Manticore) as .github/workflows/report_intake.yml, on its
# main branch (GitHub runs scheduled workflows only from the default branch; public repositories' standard runners are free).
# It needs three repository secrets there (Settings > Secrets and variables > Actions):
#   DISCORD_BOT_TOKEN    the bot's token (Discord Developer Portal > the app > Bot > Reset Token)
#   DISCORD_CHANNEL_IDS  the bug-report channel's id (several: comma-separated, e.g. bugs and ideas)
#   INTAKE_TOKEN         a fine-grained GitHub token: only Eliminate7532/commander_sim, Contents: Read and write
# Only `schedule` and manual runs start it - never a pull request, so a stranger's fork can't reach the secrets. It prints counts
# only (a public repository's log is public); the reports themselves go only to the private branch.
name: Report intake (Discord -> claude/reports)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: report-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: The private branch claude/reports
        uses: actions/checkout@v4
        with:
          repository: Eliminate7532/commander_sim
          ref: claude/reports
          token: ${{ secrets.INTAKE_TOKEN }}
          path: reports_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Copy new reports
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
          PYTHONUNBUFFERED: '1'
        run: |
          git -C reports_repo config user.name "manticore-intake"
          git -C reports_repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/report_intake.py --dest reports_repo
