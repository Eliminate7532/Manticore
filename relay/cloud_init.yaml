#cloud-config
# relay/cloud_init.yaml - written by tools/make_relay_cloud_init.py (Round RLY1). Do not edit by hand: change the tool or the relay
# and run the tool again. Paste this whole file as the server's "initialization script" (Oracle: Create instance > Show advanced
# options > Management > Paste cloud-init script). It installs Manticore's relay (relay/manticore_relay.py, sha256 56007152fce385f4f2fd316cb13be3e097142a03660b33bc175a4b95a99c9432) as a
# service on TCP port 36900 and opens that port in the server's own firewall. The cloud's firewall (Oracle: the subnet's security
# list) must allow TCP 36900 too - see relay/README.txt.
write_files:
  - path: /opt/manticore-relay/manticore_relay.py
    permissions: '0644'
    encoding: b64
    content: 
  - path: /etc/systemd/system/manticore-relay.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Manticore relay (meeting point for online games)
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/manticore-relay/manticore_relay.py --bind 0.0.0.0 --port 36900 --max-rooms 200 --log /var/log/manticore-relay/relay.log
      Restart=always
      RestartSec=3
      DynamicUser=yes
      LogsDirectory=manticore-relay
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes

      [Install]
      WantedBy=multi-user.target
  - path: /etc/logrotate.d/manticore-relay
    permissions: '0644'
    content: |
      /var/log/manticore-relay/relay.log {
        weekly
        rotate 8
        compress
        missingok
        notifempty
        copytruncate
      }
runcmd:
  - [sh, -c, "if command -v firewall-cmd >/dev/null 2>&1; then firewall-cmd --permanent --add-port=36900/tcp && firewall-cmd --reload; fi"]
  - [sh, -c, "if command -v iptables >/dev/null 2>&1; then iptables -C INPUT -p tcp --dport 36900 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport 36900 -j ACCEPT; fi"]
  - [sh, -c, "if command -v netfilter-persistent >/dev/null 2>&1; then netfilter-persistent save; fi"]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, manticore-relay]
